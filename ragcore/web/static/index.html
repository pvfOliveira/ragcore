<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ragcore</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, sans-serif; color: #1a1a1a; }
  #app { display: flex; height: 100vh; }
  #sidebar { width: 300px; border-right: 1px solid #ddd; padding: 12px; overflow-y: auto; background: #fafafa; }
  #main { flex: 1; display: flex; flex-direction: column; }
  h2 { font-size: 13px; text-transform: uppercase; color: #666; margin: 16px 0 6px; }
  .row { display: flex; gap: 6px; margin-bottom: 8px; }
  input, button, textarea { font: inherit; padding: 7px 9px; border: 1px solid #ccc; border-radius: 6px; }
  input, textarea { flex: 1; }
  button { background: #2563eb; color: #fff; border: none; cursor: pointer; }
  button.secondary { background: #e5e7eb; color: #111; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { padding: 6px 8px; border-radius: 6px; cursor: pointer; display: flex; justify-content: space-between; gap: 6px; }
  li:hover { background: #eee; }
  li.active { background: #dbeafe; }
  .meta { color: #888; font-size: 12px; }
  .del { color: #b91c1c; cursor: pointer; }
  #log { flex: 1; overflow-y: auto; padding: 16px; }
  .msg { margin: 0 0 14px; max-width: 760px; }
  .msg .who { font-weight: 600; font-size: 12px; color: #666; }
  .msg.user .who { color: #2563eb; }
  .msg .src { color: #888; font-size: 12px; margin-top: 4px; }
  #composer { display: flex; gap: 8px; padding: 12px; border-top: 1px solid #ddd; }
  #composer textarea { resize: none; height: 44px; }
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <h2>Sources</h2>
    <div class="row">
      <input id="srcInput" placeholder="URL or file path">
      <button id="addSrc">Add</button>
    </div>
    <ul id="sources"></ul>
    <h2>Chats</h2>
    <button class="secondary" id="newChat" style="width:100%;margin-bottom:8px">+ New chat</button>
    <ul id="sessions"></ul>
  </div>
  <div id="main">
    <div id="log"></div>
    <div id="composer">
      <textarea id="msg" placeholder="Ask about your sources… (Enter to send)"></textarea>
      <button id="send">Send</button>
    </div>
  </div>
</div>
<script>
const $ = s => document.querySelector(s);
let sessionId = null;

async function jget(u){ const r = await fetch(u); if(!r.ok) throw new Error((await r.json()).detail||r.statusText); return r.json(); }
async function jsend(u, method, body){ const r = await fetch(u,{method,headers:{'content-type':'application/json'},body:JSON.stringify(body)}); if(!r.ok) throw new Error((await r.json()).detail||r.statusText); return r.json(); }

function addMsg(role, content, citations){
  const d = document.createElement('div'); d.className = 'msg ' + role;
  d.innerHTML = '<div class="who">'+role+'</div><div></div>';
  d.children[1].textContent = content;
  if(citations && citations.length){ const s=document.createElement('div'); s.className='src'; s.textContent='Sources: '+citations.join(', '); d.appendChild(s); }
  $('#log').appendChild(d); $('#log').scrollTop = $('#log').scrollHeight;
}

async function loadSources(){
  const items = await jget('/api/sources');
  $('#sources').innerHTML = '';
  for(const s of items){
    const li = document.createElement('li');
    li.innerHTML = '<span>'+(s.title||s.origin||s.id)+' <span class="meta">['+s.chunks+']</span></span>';
    const x = document.createElement('span'); x.className='del'; x.textContent='✕';
    x.onclick = async (e)=>{ e.stopPropagation(); await fetch('/api/sources/'+encodeURIComponent(s.id),{method:'DELETE'}); loadSources(); };
    li.appendChild(x); $('#sources').appendChild(li);
  }
}

async function loadSessions(){
  const items = await jget('/api/sessions');
  $('#sessions').innerHTML = '';
  for(const s of items){
    const li = document.createElement('li');
    li.textContent = (s.title||s.id) + ' '; const m=document.createElement('span'); m.className='meta'; m.textContent='('+s.messages+')'; li.appendChild(m);
    if(s.id===sessionId) li.className='active';
    li.onclick = ()=> openSession(s.id);
    $('#sessions').appendChild(li);
  }
}

async function openSession(id){
  sessionId = id; $('#log').innerHTML='';
  const hist = await jget('/api/sessions/'+encodeURIComponent(id)+'/messages');
  for(const m of hist) addMsg(m.role, m.content, m.citations);
  loadSessions();
}

async function send(){
  const text = $('#msg').value.trim(); if(!text) return;
  if(!sessionId){ sessionId = (await jsend('/api/sessions','POST',{})).id; }
  $('#msg').value=''; addMsg('user', text, null);
  try {
    const r = await jsend('/api/sessions/'+encodeURIComponent(sessionId)+'/chat','POST',{message:text});
    addMsg('assistant', r.answer, r.citations);
  } catch(e){ addMsg('assistant', '[error] '+e.message, null); }
  loadSessions();
}

$('#send').onclick = send;
$('#msg').addEventListener('keydown', e=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); send(); }});
$('#newChat').onclick = async ()=>{ sessionId = (await jsend('/api/sessions','POST',{})).id; $('#log').innerHTML=''; loadSessions(); };
$('#addSrc').onclick = async ()=>{ const v=$('#srcInput').value.trim(); if(!v) return; $('#srcInput').value=''; $('#addSrc').textContent='…'; try{ await jsend('/api/sources','POST',{origin:v}); }catch(e){ alert(e.message); } $('#addSrc').textContent='Add'; loadSources(); };

loadSources(); loadSessions();
</script>
</body>
</html>
