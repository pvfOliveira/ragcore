[project]
name = "ragcore"
version = "0.1.0"
license = "Apache-2.0"
description = "Local-first RAG core (hybrid of open-notebook's libraries)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "esperanto>=2.20.0,<3",
    "content-core>=1.14.1,<2",
    "ai-prompter>=0.4,<1",
    "surrealdb>=1.0.4",
    "langgraph>=1.0.5",
    "langchain-core>=0.3",
    "typer>=0.12",
    "numpy>=1.26",
    "tiktoken>=0.7",
    "loguru>=0.7",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "fastapi>=0.104",
    "uvicorn[standard]>=0.24",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "httpx>=0.27"]
rerank = ["flashrank>=0.2"]
chroma = ["chromadb>=0.5"]
faiss = ["faiss-cpu>=1.8"]
milvus = ["pymilvus>=2.4", "milvus-lite>=2.4"]
# ragas 0.4.x still imports langchain_community.chat_models.vertexai (removed in
# langchain-community 0.4); pin <0.4 to keep that shim. trulens' transitive `munch`
# imports pkg_resources, removed from setuptools>=81; pin setuptools<81. Neither
# downgrades ragcore's langchain-core (stays 1.x) or langgraph.
# KNOWN PIN TENSION: deepeval (<8.4.0) and dspy (allows >=8.4) disagree on `click`'s
# upper bound, so `pip check` surfaces one benign metadata warning (click 8.4.x).
# It is *not* a runtime breakage — deepeval, dspy and click all import and the full
# suite (incl. the live tier) stays green; click's CLI surface they use is unchanged.
eval = [
    "ragas>=0.2",
    "trulens-core>=1.0",
    "trulens-providers-litellm>=1.0",
    "datasets>=2.0",
    "langchain-community<0.4",
    "setuptools<81",
    # >=4: deepeval 2.x imports `langchain_core.tracers.langchain_v1`, removed in
    # langchain-core 1.x (which ragcore pins); a looser bound lets the resolver
    # silently downgrade and break imports. 4.x is langchain-core-1.x clean.
    "deepeval>=4",
    "pyyaml>=6",
]
multimodal = ["open_clip_torch>=2.24", "torch>=2.2", "pillow>=10"]
# In-process OTel-GenAI tracing → Arize Phoenix (Langfuse wired as an OTLP code path).
observability = [
    "arize-phoenix>=4",
    "openinference-instrumentation>=0.1",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp>=1.20",
]
gateway = ["litellm>=1.40"]
dspy = ["dspy>=2.5"]
structured = ["instructor>=1.3", "outlines>=0.1", "openai>=1.40"]
qdrant = ["qdrant-client>=1.10"]
pgvector = ["psycopg[binary]>=3.1", "pgvector>=0.3"]
weaviate = ["weaviate-client>=4.16"]
hybrid = ["ragcore[qdrant]", "fastembed>=0.3"]
compress = ["llmlingua>=0.2,<0.3"]  # 0.2.2 verified; internal API unstable across minors
audio = ["mlx-whisper>=0.4"]
docai = ["docling>=2.0", "pymupdf4llm>=0.0.17"]
rag-upgrade = ["ragcore[rerank,chroma,faiss,milvus,qdrant,eval,multimodal,observability,gateway,dspy,structured,docai,pgvector,weaviate,hybrid,compress,audio]"]

[project.scripts]
ragcore = "ragcore.cli:app"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

# Explicit package discovery — without this, setuptools' flat-layout auto-discovery
# fails once a runtime `data/` dir exists at the repo root ("Multiple top-level
# packages discovered: ['data', 'ragcore']"). Ship only the ragcore package tree.
[tool.setuptools.packages.find]
include = ["ragcore*"]

# Ship the promptfoo eval config and the golden eval datasets (non-.py data
# files) inside the built wheel/sdist. golden/ is data inside ragcore.eval, not
# a subpackage: an __init__.py there would shadow the ragcore/eval/golden.py
# module, so the glob is keyed on the parent package.
[tool.setuptools.package-data]
"ragcore.eval.promptfoo" = ["*.yaml"]
"ragcore.eval" = ["golden/*.jsonl", "golden/*.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# The live tier (tests/live) needs a real local Ollama and takes minutes; it is
# opt-in. Run it explicitly with `pytest tests/live -m live`. The default
# `pytest tests` stays deterministic (and the conftest gate skips live items
# anyway when Ollama is unreachable).
addopts = "--ignore=tests/live"
markers = [
    "live: tests needing a reachable local Ollama (skipped otherwise)",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
